  button { background:var(--btn); color:#fff; border:1px solid var(--edge); border-radius:6px; padding:8px 12px; font:14px sans-serif; cursor:pointer; }
  button.on { background:var(--btnOn); border-color:#8aa4ff; }
  .desc { color:#cfd6e4; background:#1a2030; border:1px solid #334; border-radius:6px; padding:8px 12px; margin-bottom:10px; max-width:762px; }
  .wrap { overflow-x:auto; }
  /* 사용자 스크린샷(393×331)을 2배로 */
  #scene { position:relative; width:786px; height:662px; flex:none; background:0 0 / 786px 662px; image-rendering:pixelated; border-radius:8px; }
  .ov { position:absolute; }
  .patch { position:absolute; background:no-repeat; background-size:786px 662px; }
  .bar { position:absolute; height:14px; background:rgba(0,0,0,.75); border:2px solid rgba(0,0,0,.9); box-sizing:border-box; }
  .bar i { position:absolute; left:0; top:0; bottom:0; }
  .bar.prog { border-color:#6b5a1a; }
  .bar.prog i { background:linear-gradient(#ffe27a,#e0a800); }
  .bar.prog.paused i { background:repeating-linear-gradient(45deg,#9a8a4a 0 5px,#6a5c2a 5px 10px); }
  .cap { position:absolute; left:50%; transform:translateX(-50%); bottom:16px; white-space:nowrap; font:bold 13px sans-serif;
    background:rgba(0,0,0,.65); padding:1px 7px; border-radius:4px; color:#ffe27a; }
  .cap.paused { color:#ddd; }
  .tag { position:absolute; font:12px sans-serif; background:rgba(0,0,0,.55); color:#fff; padding:1px 6px; border-radius:4px; white-space:nowrap; }
.patch { background-image:var(--scene); }
#scene { background-image:var(--scene); }
</style>
</head>
<body>
<h1>건설 중 건물 머리 위 바 — 현재 vs 1번(건설 진행 바)</h1>
<p class="note">보내 주신 스크린샷 위에 그렸어요(2배 확대). 가정: 오른쪽 위 건물 = 일꾼이 짓는 중, 아래 빨간 탑 2개 = 일꾼이 떠나 건설 중단, 본부 = 완공 후 공격받음(비교용).</p>
<div class="controls">
  <button data-mode="now">현재</button>
  <button data-mode="opt1" class="on">1번: 짓는 중엔 건설 진행 바</button>
</div>
<div class="desc" id="desc"></div>
<div class="wrap"><div id="scene"></div></div>
<script>
const MINE = "#3d7cf0";
const S = 2;   // 확대 배율
// 원본 좌표 기준 바 위치 [x, y, 폭], 상태
const ITEMS = [
  { name:"짓는 중", bar:[280, 79, 78], hide:[278, 76, 82, 14], st:"building", total:35 },
  { name:"건설 중단", bar:[156, 281, 45], hide:[154, 278, 49, 15], st:"paused", at:0.18 },
  { name:"완공 후 공격받음", bar:[318, 222, 52], hide:null, st:"damaged", hp:0.6 },
];
const DESC = {
  now: "현재: 짓는 중인 건물은 체력이 10%에서 차오르는 중이라 '다친 건물'로 보고 체력바를 띄움 → 검은 칸에 파란 조각만 보여 검은 막대처럼 보임. 멈춘 건물도 계속 검은 막대. 완공 후 공격받은 본부와 구분이 안 됨.",
  opt1: "1번: 짓는 중엔 체력바 대신 노란 건설 진행 바 + 진행률·남은 시간. 일꾼이 떠나 멈추면 빗금 바 + '건설 중단'. 완공되면 바가 사라지고, 이후엔 다쳤을 때만 플레이어 색 체력바(본부처럼). 짓는 중에 공격받은 체력은 선택하면 정보창에서 확인.",
};
const scene = document.getElementById("scene");
const els = ITEMS.map(it => {
  let patch = null;
  if (it.hide) {   // 원래 검은 바를 바로 위쪽 땅으로 덮기
    const [x, y, w, h] = it.hide;
    patch = document.createElement("div"); patch.className = "patch";
    Object.assign(patch.style, { left:x*S+"px", top:y*S+"px", width:w*S+"px", height:h*S+"px", backgroundPosition:`${-x*S}px ${-(y-h-2)*S}px` });
    scene.append(patch);
  }
  const [bx, by, bw] = it.bar;
  const bar = document.createElement("div"); bar.className = "bar";
  Object.assign(bar.style, { left:bx*S+"px", top:by*S+"px", width:bw*S+"px" });
  const fill = document.createElement("i"); const cap = document.createElement("div"); cap.className = "cap";
  bar.append(fill, cap); scene.append(bar);
  const tag = document.createElement("div"); tag.className = "tag"; tag.textContent = it.name;
  Object.assign(tag.style, { left:bx*S+"px", top:(by*S - 44)+"px" }); scene.append(tag);
  return { it, patch, bar, fill, cap, tag };
});
let mode = "opt1";
const t0 = performance.now();
function frame(t) {
  const prog = ((t - t0) / 1000 / 12) % 1;   // 목업은 12초에 한 바퀴
  for (const e of els) {
    const { it } = e;
    e.bar.classList.remove("prog", "paused"); e.cap.style.display = "none";
    if (it.st === "damaged") {   // 본부: 두 모드 모두 플레이어 색 체력바
      e.bar.style.display = "block"; e.fill.style.width = it.hp*100 + "%"; e.fill.style.background = MINE;
      continue;
    }
    if (mode === "now") {   // 원본 스크린샷 그대로 보이게
      if (e.patch) e.patch.style.display = "none";
      e.bar.style.display = "none"; e.tag.style.top = (it.bar[1]*S - 26) + "px";
      continue;
    }
    if (e.patch) e.patch.style.display = "block";
    e.tag.style.top = (it.bar[1]*S - 48) + "px";
    const p = it.st === "building" ? prog : it.at;
    e.bar.style.display = "block"; e.bar.classList.add("prog");
    if (it.st === "paused") e.bar.classList.add("paused");
    e.fill.style.width = p*100 + "%"; e.fill.style.background = "";
    e.cap.style.display = "block"; e.cap.className = "cap" + (it.st === "paused" ? " paused" : "");
    e.cap.textContent = it.st === "paused" ? `건설 중단 ${Math.round(p*100)}%` : `${Math.round(p*100)}% · ${Math.ceil(it.total*(1-p))}초`;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
function setMode(m) {
  mode = m; document.getElementById("desc").textContent = DESC[m];
  document.querySelectorAll("button[data-mode]").forEach(b => b.classList.toggle("on", b.dataset.mode === m));
}
document.querySelectorAll("button[data-mode]").forEach(b => b.onclick = () => setMode(b.dataset.mode));
setMode("opt1");
</script>
</body>
</html>
